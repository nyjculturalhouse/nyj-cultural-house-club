<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="요일과 동아리, 출석 인원을 순서대로 입력해 출석을 등록하는 페이지입니다.">
    <title>동아리 출석체크 | 동아리 출석부</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200&icon_names=home_app_logo" rel="stylesheet" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="css/style.css?v=20260814-date-attendance" />
    <link rel="stylesheet" href="css/monochrome.css?v=20260814-date-attendance" />

    <script src="js/theme.js"></script>
</head>

<body class="min-h-screen flex flex-col antialiased">

<a href="#main-content" class="skip-link">본문 바로가기</a>

<header class="sticky top-0 z-50 bg-[#F4F4F3] border-b border-outline">
    <div class="max-w-[1200px] mx-auto px-4 h-16 flex items-center justify-between">
        <h1 class="magazine-title text-primary text-xl">동아리 출석부</h1>
        <a href="/"
           class="p-2 rounded-full hover:bg-white/50 transition flex items-center justify-center text-primary"
           aria-label="메인으로 이동">
            <span class="material-symbols-outlined" aria-hidden="true">home_app_logo</span>
        </a>
    </div>
</header>

<main id="main-content" class="flex-1 max-w-[1200px] mx-auto w-full px-4 py-10">
    <p id="attendance-completion-status" class="sr-only" role="status" aria-live="polite"></p>

    <section id="attendance-week-context" class="hidden mb-8 border border-black p-4" aria-live="polite">
        <p class="text-xs font-bold tracking-wider">선택한 출석 날짜</p>
        <p id="attendance-week-label" class="magazine-title text-xl mt-2">-</p>
        <p class="text-sm mt-2">아래에서 요일과 동아리를 선택해 출석을 등록하세요.</p>
    </section>

    <ol id="attendance-steps" class="step-indicator mb-8" aria-label="출석 등록 진행 단계">
        <li aria-current="step"><span class="step-num" aria-hidden="true">1</span>요일</li>
        <li><span class="step-num" aria-hidden="true">2</span>동아리</li>
        <li><span class="step-num" aria-hidden="true">3</span>인원</li>
    </ol>

    <div id="view-attendance" class="space-y-10">

        <section id="step-days">
            <div class="mb-6">
                <h2 class="magazine-title text-2xl text-primary">요일 선택</h2>
                <p class="text-gray-700 mt-2 text-sm font-semibold">출석을 등록할 요일을 선택하세요.</p>
            </div>
            <div id="day-buttons" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
        </section>

        <section id="step-clubs" class="hidden">
            <div class="mb-6">
                <h2 class="magazine-title text-2xl text-primary">동아리 선택</h2>
                <p class="text-gray-700 mt-2 text-sm font-semibold">출석을 시작할 동아리를 선택하세요.</p>
            </div>
            <div id="club-buttons" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </section>

        <section id="step-members" class="hidden">
            <div class="mb-6">
                <h2 id="club-title" class="magazine-title text-2xl text-primary"></h2>
                <p class="text-gray-700 mt-2 text-sm font-semibold">출석한 인원 수만 숫자로 입력하세요.</p>
            </div>

            <div class="max-w-md border border-black p-5">
                <label for="attendance-count" class="block font-bold text-primary">출석 인원</label>
                <p id="attendance-count-help" class="text-sm mt-2">회원 이름을 선택하지 않고, 오늘 출석한 인원 수만 입력합니다.</p>
                <input id="attendance-count" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" aria-describedby="attendance-count-help" class="mt-4 w-full border border-black bg-white px-4 py-3 text-xl font-bold" placeholder="예: 12">
            </div>

            <button id="btn-submit-attendance" type="button" onclick="window.submitAttendance()"
                class="w-full mt-8 bg-accent-bg text-white py-4 font-bold text-lg hover:bg-accent-hover transition disabled:opacity-60">
                출석 제출하기
            </button>
        </section>
    </div>
</main>

<div id="result-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="if(event.target===this) window.closeModal()">
    <div id="result-modal-panel" class="modal-panel attendance-result-panel p-6 text-center" tabindex="-1">
        <div id="modal-icon" class="attendance-result-icon text-4xl mb-4" aria-hidden="true"></div>
        <h2 id="modal-title" class="text-xl font-bold text-primary mb-2"></h2>
        <p id="modal-desc" class="text-gray-600 text-sm mb-6"></p>
        <button id="result-modal-confirm" type="button" onclick="closeModal()" class="w-full bg-primary text-white py-3 font-bold hover:bg-primary-hover transition">
            확인
        </button>
    </div>
</div>

<div id="previous-week-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="previous-week-modal-title" aria-describedby="previous-week-modal-text" onclick="if(event.target===this) window.AttendanceApp.keepSelectedWeek()">
    <div id="previous-week-modal-panel" class="modal-panel attendance-result-panel p-6" tabindex="-1">
        <p class="text-xs font-bold tracking-wider">직전 미출석 확인</p>
        <h2 id="previous-week-modal-title" class="text-xl font-bold text-primary mt-2">먼저 확인할 출석이 있습니다.</h2>
        <p id="previous-week-modal-text" class="text-gray-600 text-sm mt-3"></p>
        <p id="previous-week-modal-help" class="text-gray-600 text-sm mt-2">안내된 날짜의 출석을 먼저 등록하거나, 현재 선택한 날짜로 계속할 수 있습니다.</p>
        <div class="mt-6 grid gap-2 sm:grid-cols-2">
            <button id="btn-use-previous-week" type="button" class="border border-black bg-black text-white px-4 py-3 font-bold">안내된 날짜 출석하기</button>
            <button id="btn-keep-selected-week" type="button" class="border border-black bg-white text-black px-4 py-3 font-bold">현재 선택한 날짜로 계속</button>
        </div>
    </div>
</div>

<script src="js/api.js?v=20260814-date-attendance"></script>
<script src="js/utils.js?v=20260814-date-attendance"></script>
<script src="js/app.js?v=20260814-date-attendance"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (window.AttendanceApp) {
            window.AttendanceApp.init();
        }
    });
</script>

</body>
</html>
