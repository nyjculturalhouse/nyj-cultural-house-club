<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="남양주시 문화의집 대관 일정을 확인하는 캘린더입니다.">
  <title>대관 확인 | 남양주시 문화의집</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/monochrome.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="js/theme.js"></script>
</head>
<body class="text-gray-900 min-h-screen antialiased relative">
  <a href="#main-content" class="skip-link">본문 바로가기</a>
  <header class="bg-white border-b border-black sticky top-0 z-50">
    <div class="max-w-[1200px] mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
      <h1 class="magazine-title text-primary text-xl">남양주시 문화의집</h1>
      <a href="/" class="p-2 text-primary" aria-label="메인으로 이동"><span class="material-symbols-outlined" aria-hidden="true">home_app_logo</span></a>
    </div>
  </header>
  <main id="main-content" class="max-w-[1200px] mx-auto px-4 md:px-6 py-10">
    <div class="mb-8 border-b border-black pb-5">
      <p class="text-sm font-semibold tracking-[0.08em]">공간 이용</p>
      <h2 class="magazine-title text-3xl text-primary mt-2">대관 확인</h2>
      <p class="text-gray-700 mt-2 text-sm">등록된 공간 이용 일정을 캘린더에서 확인하세요.</p>
    </div>
    <section aria-label="대관 일정 캘린더" class="bg-white border border-black p-3 md:p-6">
      <div id="calendar" aria-label="대관 캘린더"></div>
      <p id="booking-calendar-status" class="mt-4 text-sm text-gray-700" role="status" aria-live="polite"></p>
    </section>
  </main>
  <div id="booking-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-booking-title" onclick="if(event.target===this) closeBookingModal()">
    <div class="modal-panel border border-black rounded-none">
      <div class="p-6 md:p-8">
        <div class="flex justify-between items-start gap-4 mb-6">
          <div>
            <p id="modal-space-badge" class="text-xs font-bold tracking-wide mb-2">공간명</p>
            <h2 id="modal-booking-title" class="magazine-title text-2xl text-primary leading-snug">대관 일정</h2>
          </div>
          <button type="button" onclick="closeBookingModal()" class="p-1 text-primary" aria-label="닫기"><span class="material-symbols-outlined text-2xl" aria-hidden="true">close</span></button>
        </div>
        <div class="border-t border-black pt-5 text-sm">
          <p class="text-xs font-bold text-gray-500 tracking-wide">이용 시간</p>
          <p id="modal-booking-time" class="text-primary font-medium mt-2">-</p>
        </div>
        <button type="button" onclick="closeBookingModal()" class="w-full bg-black text-white font-bold py-3 mt-8 text-sm">확인</button>
      </div>
    </div>
  </div>
  <footer class="w-full py-8 text-center text-xs text-gray-500 font-medium tracking-wider border-t border-black/30"><p>© 2026 남양주시 문화의집. 모든 권리 보유.</p></footer>
  <script src="js/api.js"></script>
  <script>
    let calendar = null;
    const formatDateTime = (value) => new Intl.DateTimeFormat('ko-KR', { dateStyle: 'long', timeStyle: 'short' }).format(new Date(value));
    function openBookingModal(spaceName, titleText, rawStart) {
      document.getElementById('modal-space-badge').textContent = spaceName || '공간 미지정';
      document.getElementById('modal-booking-title').textContent = titleText || '대관 일정';
      document.getElementById('modal-booking-time').textContent = rawStart ? formatDateTime(rawStart) : '-';
      document.getElementById('booking-modal').classList.remove('hidden');
    }
    function closeBookingModal() { document.getElementById('booking-modal').classList.add('hidden'); }
    function setCalendarStatus(message, state) {
      const status = document.getElementById('booking-calendar-status');
      status.dataset.state = state;
      status.textContent = message;
    }
    function initCalendar() {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth', locale: 'ko', editable: false, selectable: false, eventColor: '#000000',
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,listWeek' },
        buttonText: { today: '오늘', month: '월', week: '주', list: '목록' },
        eventClick(info) { const props = info.event.extendedProps; openBookingModal(props.space, info.event.title, props.rawStart); },
        events: async (info, successCallback) => {
          setCalendarStatus('대관 일정 정보를 불러오는 중입니다.', 'loading');
          try {
            const bookings = await apiGet('getBookings');
            if (!Array.isArray(bookings)) throw new Error('invalid bookings');
            setCalendarStatus(bookings.length ? '' : '등록된 대관 일정이 없습니다.', bookings.length ? 'success' : 'empty');
            successCallback(bookings.map((item) => ({ title: item.title, start: item.start, extendedProps: { space: item.space, rawStart: item.start } })));
          } catch (error) {
            console.error('대관 캘린더 로드 실패:', error);
            setCalendarStatus('대관 일정 데이터를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.', 'error');
            successCallback([]);
          }
        }
      });
      calendar.render();
    }
    window.closeBookingModal = closeBookingModal;
    initCalendar();
  </script>
</body>
</html>
