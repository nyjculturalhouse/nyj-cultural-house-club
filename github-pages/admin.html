<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운영 관리 | 남양주시 문화의집</title><link rel="stylesheet" href="./assets/site.css"></head><body><header class="top"><div class="wrap"><a class="brand" href="./index.html"><span>N</span>남양주시 문화의집 운영 관리</a><a class="button" href="./programs.html">공개 화면</a></div></header><main class="admin-shell"><section id="login" class="admin-login"><p class="eyebrow">관리자 보호</p><h1>관리자 비밀번호</h1><p>프로그램과 사진을 관리하려면 비밀번호를 입력해 주세요.</p><form id="login-form"><input id="password" type="password" inputmode="numeric" autocomplete="current-password" required><button class="button--black" type="submit">확인</button><p id="login-note"></p></form></section><section id="admin" class="hidden"><p class="eyebrow">프로그램 입력</p><h1>프로그램 관리</h1><p>제목만 입력해도 저장할 수 있습니다. 사진을 선택하면 Google Drive에 자동 저장됩니다. 임시저장은 공개 화면에 보이지 않습니다.</p><div class="admin-actions"><button id="new" type="button">새 프로그램</button><button id="preview" type="button">미리보기</button><a class="button" href="./programs.html" target="_blank">공개 목록</a><span id="note"></span></div><form id="form" class="admin-form"><label>프로그램 ID<input name="externalId" placeholder="비우면 제목으로 자동 생성"></label><label>프로그램 제목<input name="title" required></label><label class="span-2">한 줄 소개<input name="summary" placeholder="비우면 제목으로 자동 생성"></label><label>시작 일시<input name="startAt" type="datetime-local"></label><label>종료 일시<input name="endAt" type="datetime-local"></label><label>모집 상태<select name="recruitmentStatus"><option value="upcoming">예정</option><option value="open">모집 중</option><option value="closing-soon">마감 임박</option><option value="closed">마감</option></select></label><label>공개 상태<select name="isPublished"><option value="false">임시저장 · 비공개</option><option value="true">공개</option></select></label><label>대표 사진<input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>주제<input name="category"></label><label>대상<input name="target"></label><label>장소<input name="venue"></label><label>신청처<select name="applicationProvider"><option value="none">준비 중</option><option value="nyjcf">문화재단</option><option value="naver">네이버폼</option><option value="other">기타</option></select></label><label>신청 링크<input name="applicationUrl" type="url" placeholder="https://"></label><label>문의처<input name="contact" placeholder="031-000-0000"></label><label class="span-2">상세 소개<textarea name="description"></textarea></label><label class="span-2">신청 전 확인<textarea name="preApplicationChecks"></textarea></label><input name="imageUrl" type="hidden"><div class="span-2 admin-actions"><button class="button--black" type="submit">저장</button><button id="draft" type="button">임시저장</button><button id="delete" type="button">삭제</button></div></form><h2>저장된 프로그램</h2><div id="saved" class="admin-list"></div></section></main><div id="preview-modal" class="preview"><div class="preview__panel"><button id="close-preview" type="button">닫기</button><div id="preview-body"></div></div></div><script type="module">import{gasPost,formatDate,imageMarkup}from'./assets/gas.js';let password=sessionStorage.getItem('nyj-gas-admin-password')||'',current={};const $=s=>document.querySelector(s),form=$('#form'),note=$('#note');const fields=['externalId','title','summary','description','category','target','venue','startAt','endAt','recruitmentStatus','applicationUrl','applicationProvider','contact','preApplicationChecks','imageUrl','isPublished'];function say(m,bad=false){note.textContent=m;note.className=bad?'notice error':'notice'}function serialize(){const out={adminPassword:password};fields.forEach(k=>{out[k]=form.elements[k].value});out.isPublished=out.isPublished==='true';return out}function fill(row={recruitmentStatus:'upcoming',applicationProvider:'none',isPublished:false}){current=row;fields.forEach(k=>{if(form.elements[k])form.elements[k].value=k==='isPublished'?String(!!row[k]):row[k]||''})}async function load(){const rows=await gasPost({mode:'adminListPrograms',adminPassword:password});$('#saved').innerHTML=rows.length?rows.map(row=>`<article class="admin-row"><img src="${row.imageUrl||''}" alt="" onerror="this.remove()"><p class="meta">${row.isPublished?'공개':'임시저장'} · ${formatDate(row.startAt)}</p><h3>${row.title||'제목 없음'}</h3><p>${row.summary||''}</p><button data-id="${row.externalId}">편집</button></article>`).join(''):'<p class="empty">저장한 프로그램이 없습니다.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>fill(rows.find(r=>r.externalId===b.dataset.id)))}async function upload(file){if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('JPG, PNG, WEBP만 올릴 수 있습니다.');if(file.size>5*1024*1024)throw new Error('사진은 5MB 이하로 올려주세요.');const dataUrl=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});const result=await gasPost({mode:'adminUploadProgramImage',adminPassword:password,fileName:file.name,contentType:file.type,dataUrl});form.elements.imageUrl.value=result.imageUrl;say('사진을 Google Drive에 저장했습니다. 저장하면 프로그램에 연결됩니다.')}$('#login-form').onsubmit=async e=>{e.preventDefault();password=$('#password').value;try{const r=await gasPost({mode:'verifyAdminPassword',adminPassword:password});if(!r.valid)throw new Error('비밀번호가 맞지 않습니다.');sessionStorage.setItem('nyj-gas-admin-password',password);$('#login').classList.add('hidden');$('#admin').classList.remove('hidden');await load()}catch(err){$('#login-note').textContent=err.message}};if(password){$('#login').classList.add('hidden');$('#admin').classList.remove('hidden');load().catch(()=>sessionStorage.removeItem('nyj-gas-admin-password'))}$('#new').onclick=()=>{fill();say('새 프로그램을 입력하세요.')};$('#image').onchange=async e=>{try{await upload(e.target.files[0])}catch(err){say(err.message,true)}};form.onsubmit=async e=>{e.preventDefault();try{const r=await gasPost({...serialize(),mode:'adminSaveProgram'});fill(r.item);say(r.created?'프로그램을 저장했습니다.':'프로그램을 수정했습니다.');await load()}catch(err){say(err.message,true)}};$('#draft').onclick=()=>{form.elements.isPublished.value='false';form.requestSubmit()};$('#delete').onclick=async()=>{if(!current.externalId||!confirm('삭제할까요?'))return;try{await gasPost({mode:'adminDeleteProgram',adminPassword:password,externalId:current.externalId});fill();await load();say('프로그램을 삭제했습니다.')}catch(err){say(err.message,true)}};$('#preview').onclick=()=>{const p=serialize();$('#preview-body').innerHTML=`${imageMarkup(p)}<p class="eyebrow">${p.category||'프로그램'}</p><h1>${p.title||'프로그램 제목'}</h1><p>${p.summary||'한 줄 소개'}</p><p>${p.description||''}</p>`;$('#preview-modal').classList.add('is-open')};$('#close-preview').onclick=()=>$('#preview-modal').classList.remove('is-open')</script></body></html>
