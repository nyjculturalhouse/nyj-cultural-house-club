<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로그램 안내 | 남양주시 문화의집</title><link rel="stylesheet" href="./assets/site.css"></head><body><header class="top"><div class="wrap"><a class="brand" href="./index.html"><span>N</span>남양주시 문화의집</a><a class="button" href="./programs.html">프로그램 목록</a></div></header><main id="detail" class="wrap detail"><p class="notice">프로그램을 불러오는 중입니다.</p></main><script type="module">import{gasGet,formatDate,imageMarkup}from'./assets/gas.js';const target=document.querySelector('#detail'),id=new URLSearchParams(location.search).get('id');try{const items=await gasGet('getPrograms'),p=items.find(x=>x.externalId===id);if(!p)throw new Error('프로그램을 찾지 못했습니다.');target.innerHTML=`<article><p class="eyebrow">${p.category||'프로그램'}</p><h1>${p.title}</h1><p>${p.summary}</p>${imageMarkup(p)}<h2>프로그램 소개</h2><p>${(p.description||p.summary).replace(/\n/g,'<br>')}</p></article><aside><p><b>일정</b><br>${formatDate(p.startAt)}${p.endAt?' ~ '+formatDate(p.endAt):''}</p><p><b>장소</b><br>${p.venue||'추후 안내'}</p><p><b>대상</b><br>${p.target||'누구나'}</p><p><b>문의</b><br>${p.contact||'남양주시 문화의집'}</p>${p.applicationUrl?`<a class="button button--black" href="${p.applicationUrl}" target="_blank" rel="noreferrer">신청하기</a>`:''}</aside>`}catch(e){target.innerHTML=`<p class="notice error">${e.message}</p>`}</script></body></html>
